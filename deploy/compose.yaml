# Rubato's stack, as it runs in /opt/stacks/rubato on the apps host (Dockge). A deploy copies this
# file and livekit.yaml there and sets the app's image tag; redeploy with
# `docker compose up -d --pull never`, not Dockge's Update button. See README.md.
#
# Without a profile only `app` runs. `COMPOSE_PROFILES=voice` in the stack's .env adds LiveKit for
# a plan room's voice channel (ADR 0073); Rubato itself never starts or talks to it.
# `COMPOSE_PROFILES=public` adds Caddy, which ends TLS for a server on the internet (ADR 0090):
# set RUBATO_DOMAIN, RUBATO_ACME_EMAIL, RUBATO_APP_BIND=127.0.0.1, RUBATO_PUBLIC_URL=https://<domain>
# and RUBATO_TRUSTED_PROXY=172.31.250.0/24 (the `edge` network below) in .env. See README.md.
services:
  app:
    image: local/rubato:sha-b14523f # pinned; a rollback is the previous tag
    pull_policy: never
    restart: unless-stopped
    ports:
      # On a LAN the app is reached at this port. On the internet set RUBATO_APP_BIND=127.0.0.1,
      # so nothing but Caddy reaches it.
      - "${RUBATO_APP_BIND:-0.0.0.0}:8081:8080"
    networks: [default, edge]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    profiles: ["public"]
    image: caddy:2.11.9-alpine # pinned, never latest; checked by compose.test.ts
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [edge]
    environment:
      RUBATO_DOMAIN: "${RUBATO_DOMAIN}"
      RUBATO_ACME_EMAIL: "${RUBATO_ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account: kept, or every restart asks for new ones.
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.13.11 # pinned, never latest; checked by compose.test.ts
    restart: unless-stopped
    # On a bridge network LiveKit advertises the container's IP and media never connects.
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # The pair Rubato signs join tokens with, written once in .env.
      LIVEKIT_KEYS: "${RUBATO_LIVEKIT_API_KEY}: ${RUBATO_LIVEKIT_API_SECRET}"
      # The address browsers on the LAN reach this host at.
      NODE_IP: "${LIVEKIT_NODE_IP}"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Between Caddy and the app, with a fixed subnet so RUBATO_TRUSTED_PROXY can name it: the app
  # reads X-Forwarded-For only from an address in it (ADR 0090).
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
