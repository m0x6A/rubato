# A second workspace for the e2e server (issue #89): a small application of its own. Its repos are
# not the seeded one, so the default workspace's issues and tests are unchanged. Two repos, so the
# By repo grouping has two boxes to drop a part or a box onto (issue #144).
version: 1
name: shop
repos: [{ name: acme/shop }, { name: acme/ledger }]
nodes:
  - { id: storefront, kind: context, repo: acme/shop, description: "What shoppers see" }
  - { id: checkout, kind: context, repo: acme/shop, description: "Takes the order" }
  - { id: ledger, kind: context, repo: acme/ledger, description: "Books every order" }
  - { id: payments, kind: external, description: "The card processor" }
seams:
  - { id: storefront-checkout, from: storefront, to: checkout, owner: checkout }
  - { id: checkout-payments, from: checkout, to: payments, owner: checkout }
  - { id: checkout-ledger, from: checkout, to: ledger, owner: ledger }
