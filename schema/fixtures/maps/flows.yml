# A map with flows on one seam and none on the other. Read by the Rust and the TypeScript side;
# both must parse it to flows.json.
version: 1
name: flows-fixture
nodes:
  - id: web
    kind: context
    description: The browser view.
  - id: server
    kind: context
  - id: store
    kind: external
seams:
  - id: web-server
    from: web
    to: server
    owner: server
    carries: HTTP JSON and one websocket
    description: The browser reads the whole picture and writes pins.
    flows:
      - kind: data
        from: server
        to: web
        carries: Overview
      - kind: data
        from: web
        to: server
        carries: PinRequest
      - kind: control
        from: server
        to: web
        carries: WebEvent Changed
  - id: server-store
    from: server
    to: store
    owner: server
