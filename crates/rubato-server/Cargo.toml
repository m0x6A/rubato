[package]
name = "rubato-server"
description = "Shared Rubato server: map, issue pins, plans, progress derivation, decisions, GitHub OAuth, companion intake, websocket fan-out, embedded web."
edition.workspace = true
version.workspace = true
repository.workspace = true

[[bin]]
name = "rubato-server"
path = "src/main.rs"

[dependencies]
rubato-protocol = { path = "../rubato-protocol" }
rubato-graph = { path = "../rubato-graph" }
# Reading a repository tarball for the context graph (ADR 0084): the response body in frames,
# then gzip and tar as a stream.
http-body-util = "0.1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Symbols, imports and references for the context graph (ADR 0085). Exact versions: a grammar
# upgrade can change which symbols are found, and comes with a bump of the generator version.
tree-sitter = "=0.27.2"
tree-sitter-tags = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
uuid.workspace = true
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
axum = { version = "0.8", features = ["ws", "json", "macros", "query"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "json", "migrate", "macros"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
octocrab = { version = "0.54", default-features = false, features = ["default-client", "rustls", "rustls-ring", "rustls-webpki-tokio", "timeout", "retry", "follow-redirect", "jwt-aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "webpki-roots"] }
async-trait = "0.1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "=0.33.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.0", features = ["http-proto", "reqwest-rustls", "trace", "metrics"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"

[dev-dependencies]
# The OpenAI-compatible speech stub in kernel/speech.rs reads multipart forms (plan 146).
axum = { version = "0.8", features = ["multipart"] }
opentelemetry_sdk = { version = "=0.33.0", features = ["testing"] }
tempfile = "3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
