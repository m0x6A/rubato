[package]
name = "rubato-companion"
description = "Per-developer daemon: connects outbound to rubato-server, pushes tmux-ide session state and Claude Code hook events, launches sessions for its paired user only."
edition.workspace = true
version.workspace = true
repository.workspace = true

[[bin]]
name = "rubato-companion"
path = "src/main.rs"

[dependencies]
rubato-protocol = { path = "../rubato-protocol" }
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
uuid.workspace = true
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "=0.33.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.0", features = ["http-proto", "reqwest-rustls", "trace", "metrics"] }
rand = "0.9"
url = "2"

[dev-dependencies]
cucumber = { version = "0.23", features = ["macros"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }

[[test]]
name = "cucumber"
path = "tests/cucumber/main.rs"
harness = false
