# Rubato's own system map. Every id here is one that plans, pins and the plan check may use.
# Shape: first draft of schema/system-map.schema.json (docs/plans/v0.md, task 2).
version: 1
name: rubato
owner_rule: >
  The owner side of a seam is the node whose team is woken when the seam breaks.
  For a seam with an external node, the owner is always the Rubato side.

repos:
  - name: m0x6A/rubato
    plan_path: docs/plans/{issue}.md

nodes:
  - id: rubato-protocol
    kind: contract
    repo: m0x6A/rubato
    path: crates/rubato-protocol
    description: Shared serde types, JSON Schema export, OTel attribute names and limits. No I/O.

  - id: rubato-companion
    kind: context
    repo: m0x6A/rubato
    path: crates/rubato-companion
    description: One per developer machine. Outbound only. Runs tmux, git worktree and claude for its paired user.

  - id: rubato-server
    kind: context
    repo: m0x6A/rubato
    path: crates/rubato-server
    description: One per team. Map, pins, plans, progress derivation, decisions, GitHub OAuth, websocket fan-out, embeds web.

  - id: web
    kind: context
    repo: m0x6A/rubato
    path: web
    description: React map view served by the server.

  - id: skill-rubato
    kind: context
    repo: m0x6A/rubato
    path: skills/rubato
    description: Claude Code skill installed in every connected repo. Loads map and ADRs, writes the plan, ships hook config.

  - id: plan-check
    kind: context
    repo: m0x6A/rubato
    path: actions/plan-check
    description: GitHub Action. Fails a PR whose plan names an unknown id or lacks an O-row per seam.

  - id: plan-file
    kind: contract
    repo: m0x6A/rubato
    path: schema/plan.schema.json
    description: The plan Markdown on an issue branch. Affected-parts and O-rows tables parsed to JSON.

  - id: system-map
    kind: contract
    repo: m0x6A/rubato
    path: schema/system-map.schema.json
    description: A team's system-map.yml. Node and seam ids referenced by pins and plans.

  - id: github
    kind: external
    description: Issues, comments, PRs, checks, OAuth, REST, Projects v2 GraphQL, plan files on branches.

  - id: tmux-ide
    kind: external
    description: Session runner (TypeScript CLI, npm tmux-ide, tmux >= 3.7). worktree create, events, team --json, send, wait, MCP. Version pinned by the companion.

  - id: claude-code
    kind: external
    description: The only agent in v0. Hooks are the event source. Exports its own OTel.

seams:
  - id: companion-server
    from: rubato-companion
    to: rubato-server
    carries: CompanionMessage / ServerMessage envelopes, JSON over one outbound websocket
    owner: rubato-server
    guard: protocol JSON Schema snapshot test; both suites replay crates/rubato-protocol/fixtures/
    description: "Each companion reports what its sessions are doing, and receives launch commands for its own user only. The companion always dials out."
    flows:
      - { kind: data, from: rubato-companion, to: rubato-server, carries: "SessionState snapshots, HookEvent, Heartbeat, StaleSession, LaunchResult, CapHit" }
      - { kind: control, from: rubato-server, to: rubato-companion, carries: "LaunchCommand, for the paired user only" }
      - { kind: control, from: rubato-server, to: rubato-companion, carries: Welcome with limits and the last sequence seen; acks }

  - id: server-github
    from: rubato-server
    to: github
    carries: OAuth login, REST (issues, comments, PRs, checks, contents), Projects v2 GraphQL later
    owner: rubato-server
    guard: one GitHubApi trait with recorded-response tests; rubato.github.rate_limit.remaining alert
    description: "The server reads what GitHub already knows about an issue and, as a GitHub App, proposes map changes as pull requests."
    flows:
      - { kind: data, from: github, to: rubato-server, carries: "open issues, issue state, Decision: comments, pull requests, check runs, plan files and the map from branches" }
      - { kind: data, from: github, to: rubato-server, carries: "who a login is, and whether the account can access the App installation" }
      - { kind: control, from: rubato-server, to: github, carries: "OAuth login redirect; a branch, a commit and a pull request for a map draft" }

  - id: companion-tmux-ide
    from: rubato-companion
    to: tmux-ide
    carries: worktree create, events --follow --json, team --json, send, wait
    owner: rubato-companion
    guard: Gherkin against real tmux-ide on tmux -L rubato-test; version pinned (2.9.x), reported as rubato.tmux_ide.version; low-confidence state renders unknown
    description: "The companion asks tmux-ide to create worktrees and sessions, and reads which sessions exist and what state they are in."
    flows:
      - { kind: control, from: rubato-companion, to: tmux-ide, carries: "worktree create, send, wait" }
      - { kind: data, from: tmux-ide, to: rubato-companion, carries: "team --json and events --follow --json: sessions, panes, agent status" }

  - id: companion-claude-code
    from: rubato-companion
    to: claude-code
    carries: hook stdin JSON (async hooks); launch flags (--session-id, --settings, --permission-mode); OTel env (OTEL_RESOURCE_ATTRIBUTES)
    owner: rubato-companion
    guard: Gherkin replays recorded hook payloads per event name; fixtures refreshed on Claude Code upgrade
    description: "The companion starts Claude Code with a session id, hooks and telemetry attributes, and hears every hook the session fires."
    flows:
      - { kind: control, from: rubato-companion, to: claude-code, carries: "launch: --session-id, --settings with hooks, --permission-mode, OTEL_RESOURCE_ATTRIBUTES, the prompt" }
      - { kind: data, from: claude-code, to: rubato-companion, carries: "hook payloads on stdin (session start, tool use, stop, notification); the transcript with usage" }

  - id: skill-plan-file
    from: skill-rubato
    to: plan-file
    carries: plan Markdown at the agreed path with the agreed sections
    owner: plan-file
    guard: skill Vitest writes a plan and runs the plan check on it
    description: "The skill writes the plan in the agreed form at the agreed path, so the team and the plan check can read it."
    flows:
      - { kind: data, from: skill-rubato, to: plan-file, carries: "plan Markdown: frontmatter, Affected parts, Flows, O-rows, Assumed, Tasks" }

  - id: server-plan-file
    from: rubato-server
    to: plan-file
    carries: plan parsed from the branch
    owner: plan-file
    guard: schema/fixtures/plans/ parsed identically by Rust and TypeScript
    description: "The server reads each issue branch's plan and paints the map with it."
    flows:
      - { kind: data, from: plan-file, to: rubato-server, carries: "Plan: affected parts, flows, O-rows, assumptions, caps" }

  - id: plan-check-plan-file
    from: plan-check
    to: plan-file
    carries: plan parsed in the Action
    owner: plan-check
    guard: same fixtures; a fixture that must fail, asserted in CI
    description: The Action reads the same plan and fails the pull request when it names an unknown id or misses an O-row.
    flows:
      - { kind: data, from: plan-file, to: plan-check, carries: Plan parsed with the same rules as the server }
      - { kind: control, from: plan-check, to: plan-file, carries: "pass or fail on the pull request, with the rubato.plan.check line" }

  - id: skill-system-map
    from: skill-rubato
    to: system-map
    carries: node and seam ids offered to the session
    owner: system-map
    guard: schema validation before use; rubato.map.version on every launch
    description: "The skill offers a session only the ids the map has, with the flows that already cross each seam."
    flows:
      - { kind: data, from: system-map, to: skill-rubato, carries: "node and seam ids, descriptions, flows, the plan path template, the map version" }

  - id: server-system-map
    from: rubato-server
    to: system-map
    carries: map loaded; pins and plans resolved against it
    owner: system-map
    guard: schema validation on load; rubato.map.load_failures counter
    description: "The server loads the map, refuses an invalid one and keeps the previous, and resolves pins and plans against it."
    flows:
      - { kind: data, from: system-map, to: rubato-server, carries: "SystemMap: parts, seams, flows, repos" }
      - { kind: control, from: rubato-server, to: system-map, carries: a map draft proposed as a pull request on the map repository }

  - id: web-server
    from: web
    to: rubato-server
    carries: REST and websocket; TS types generated from the protocol schema
    owner: rubato-server
    guard: generated web/src/protocol.ts diffed in CI
    description: "The browser reads the whole picture in one payload, is told when it changed, and writes what a person does on the map."
    flows:
      - { kind: data, from: rubato-server, to: web, carries: "Overview: map, issues with derived progress, findings, companions, backlog, layout" }
      - { kind: control, from: rubato-server, to: web, carries: "WebEvent Changed over /ws/web: fetch the overview again" }
      - { kind: data, from: web, to: rubato-server, carries: "PinRequest, MapLayout, PairApproveRequest" }
      - { kind: control, from: web, to: rubato-server, carries: "LaunchRequest: start a session on your own companion; map reload; login and logout" }
