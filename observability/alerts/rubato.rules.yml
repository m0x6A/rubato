# Things that must never be silent (AGENTS.md). Metric names are the OTLP names from
# crates/rubato-protocol/src/otel.rs after the Prometheus conversion (dots to underscores,
# _total on counters). Each rule has a unit test in tests/ that makes it fire on purpose.
groups:
  - name: rubato
    rules:
      # N is the server's configured threshold (#105), exported as rubato.companion.silent_secs;
      # without that series the rule falls back to the AGENTS.md default of 600 s, never silent.
      - alert: CompanionSilent
        expr: time() - max by (rubato_companion_id, rubato_user) (rubato_companion_heartbeat) > on() group_left() (max(rubato_companion_silent_secs) or vector(600))
        for: 0m
        labels:
          severity: page
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "Companion {{ $labels.rubato_companion_id }} ({{ $labels.rubato_user }}) has not reported for {{ $value | humanizeDuration }}"
          panel: Companions

      - alert: SessionWorkingNoHooks
        expr: |
          sum by (rubato_companion_id) (rubato_sessions_by_state{rubato_session_state="working"}) > 0
          and
          sum by (rubato_companion_id) (rate(rubato_hook_forwarded_total[2m])) == 0
        for: 2m
        labels:
          severity: page
          seam: companion-claude-code
          owner: rubato-companion
        annotations:
          summary: "A session on companion {{ $labels.rubato_companion_id }} reports working but no hook has arrived"
          panel: Hooks/min vs working sessions

      - alert: PlanUnknownNodes
        expr: rubato_plan_unknown_id_count > 0
        for: 0m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} plan id(s) are not in the map of workspace {{ if $labels.rubato_tenant }}{{ $labels.rubato_tenant }}/{{ end }}{{ $labels.rubato_workspace }}"
          panel: Plan checks

      - alert: SeamCollision
        expr: rubato_seam_open_plans > 1
        for: 0m
        labels:
          severity: ticket
          owner: rubato-server
        annotations:
          summary: "{{ $value }} open plans touch seam {{ $labels.rubato_seam }} in workspace {{ if $labels.rubato_tenant }}{{ $labels.rubato_tenant }}/{{ end }}{{ $labels.rubato_workspace }}"
          panel: Map

      - alert: GitHubRateLimitLow
        expr: rubato_github_rate_limit_remaining / rubato_github_rate_limit_limit < 0.10
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "GitHub rate limit under 10% ({{ $value | humanizePercentage }})"
          panel: GitHub calls · Rate limit

      # The poll loop ticks at least every 300 s (RUBATO_GITHUB_POLL_SECS is clamped), so ten
      # minutes without a tick means the loop is dead or hung, or the server is gone (#20, O1).
      - alert: ServerPollSilent
        expr: increase(rubato_poll_ticks_total[10m]) == 0 or absent_over_time(rubato_poll_ticks_total[10m])
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "rubato-server has not completed a poll tick for 10 minutes"
          panel: Poll ticks

      # #104, ADR 0039: the traffic report is older than 10 minutes while a source is configured.
      # The server reports stale (and draws unknown) past 3 × the fetch interval; this pages on a
      # dead source. With no source the gauge is not exported, so the rule stays silent.
      - alert: TrafficReportStale
        # Per workspace (ADR 0075): each one with a source has its own report; default's series
        # carries no rubato_workspace label, as before workspaces.
        expr: max by (rubato_tenant, rubato_workspace) (rubato_traffic_report_age) > 600
        for: 0m
        labels:
          severity: ticket
          seam: web-server
          owner: rubato-server
        annotations:
          summary: "The traffic report of workspace {{ if $labels.rubato_workspace }}{{ $labels.rubato_workspace }}{{ else }}default{{ end }} is {{ $value }}s old: the Traffic lens says unknown"
          panel: Traffic report age

      # #322, ADR 0084: no tick has found a context graph source current for three regeneration
      # intervals: a build that keeps failing, a stopped timer, GitHub refusing. Agents still get
      # answers, from the last good graph and with its age; this says the age is no longer
      # normal. The age is read from the stored time when collected, so it rises with no tick at
      # all. With the flag off neither gauge is exported and the rule stays silent.
      - alert: ContextGraphStale
        expr: |
          max by (rubato_graph_source) (rubato_graph_source_age)
            > on () group_left () (3 * max(rubato_graph_regen_interval))
        for: 0m
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "The context graph source {{ $labels.rubato_graph_source }} was last current {{ $value }}s ago: agents read an old graph"
          panel: Context graph source age

      # #322, ADR 0086: a companion's copy of the context graph has been behind the list the
      # server announced for three regeneration intervals: a snapshot that never matches its
      # hash, a route that refuses, a copy that cannot be written. The server looks healthy from
      # its own side (ContextGraphStale stays silent), so this is the only rule that sees it.
      # The gauge is 0 while the copy matches and is observed when collected, so it rises with
      # no sync at all. Without the server's interval series it falls back to the default 900 s.
      - alert: ContextGraphCopyBehind
        expr: |
          max by (rubato_companion_id) (rubato_graph_copy_behind)
            > on () group_left () (3 * (max(rubato_graph_regen_interval) or vector(900)))
        for: 0m
        labels:
          severity: ticket
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "Companion {{ $labels.rubato_companion_id }}'s copy of the context graph has been behind for {{ $value | humanizeDuration }}: its agents read an old graph"
          panel: Context graph snapshots served and synced

      # #345, ADR 0087: a companion's list of sources was cut at 256. The companion then matches
      # the list it was sent, so ContextGraphCopyBehind reads 0 while its agents miss whole
      # repositories. The cut is counted each time a list is announced, so this stays up while
      # a person's tenants hold more built sources than the cap.
      - alert: ContextGraphSourcesCut
        expr: sum(increase(rubato_graph_sources_truncated_total[1h])) > 0
        labels:
          severity: ticket
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "A companion's list of context graph sources was cut at 256: its agents miss some repositories and no other rule sees it"
          panel: Graph sources per companion

      # #122, ADR 0051: a message has waited more than 10 minutes while its launched session
      # waits for input (last hook Stop or idle_prompt; a fresh launch never counts). The queue
      # does not move: the companion is not live, lacks session_input, or keeps answering not_idle.
      - alert: SessionMessageStuck
        expr: max(rubato_session_messages_oldest_idle_queued_seconds) > 600
        for: 5m
        labels:
          severity: ticket
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "A session message has waited {{ $value | humanizeDuration }} for a session that waits for input"
          panel: Oldest message waiting for an idle session

      # #122, ADR 0055: an approval delivered more than 30 minutes ago, still current, with no
      # matching commit and no committed handoff report. A plan_changed handoff makes the
      # approval no longer current, so it does not count.
      - alert: ApprovalNoHandoff
        expr: max(rubato_plans_handoff_overdue) > 0
        for: 30m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} approval(s) in Rubato have not reached their branch"
          panel: Approvals waiting for handoff

      # #122, ADR 0055: a handoff commit is on the branch, but its link comment is not on the issue.
      - alert: HandoffNoLinkComment
        expr: max(rubato_plans_link_comment_missing) > 0
        for: 30m
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "{{ $value }} handoff commit(s) have no link comment on their issue"
          panel: Link comments missing

      # #122, ADR 0054: the plan on a branch carries an approval record that differs from
      # Rubato's, or one Rubato did not make. No link comment is posted for it.
      - alert: ApprovalRecordMismatch
        expr: max(rubato_plans_approval_record_mismatch) > 0
        for: 5m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} plan(s) carry an approval record that differs from Rubato's"
          panel: Approval records that differ

      # #138, ADR 0062: a headless turn was killed by its total or quiet bound, or was found still
      # running after a companion restart. A cap or a stop is already an event (CapHit, Ended),
      # so those reasons do not page.
      - alert: HeadlessTurnsKilled
        expr: sum(increase(rubato_headless_killed_total{rubato_reason=~"timeout|quiet|companion_restarted"}[30m])) > 0
        labels:
          severity: ticket
          seam: companion-claude-code
          owner: rubato-companion
        annotations:
          summary: "Headless turns were killed by a time bound or at a companion restart in the last 30 minutes"
          panel: Headless turns

      # #208, ADR 0074: the catch-up poll had to find a change more than 30 minutes after the
      # last accepted webhook delivery. The hook is broken (webhook URL, secret, tunnel, or an
      # event the App is not subscribed to) and the 15-minute poll is hiding it. Both gauges are
      # exported only while webhooks are on, so a server without the secret stays silent.
      - alert: GitHubWebhooksSilent
        expr: max(rubato_github_catchup_last_change_at) - max(rubato_github_webhook_last_accepted_at) > 1800
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "The catch-up poll found a change more than 30 minutes after the last GitHub webhook delivery"
          panel: Webhooks

      # #208, ADR 0074: an accepted delivery has waited over 5 minutes to be applied: the refresh
      # keeps failing or the poll loop is stuck, while deliveries arrive.
      - alert: GitHubWebhooksStuck
        expr: max(rubato_github_webhook_pending_oldest_seconds) > 300
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "A GitHub webhook delivery has waited over 5 minutes to be applied"
          panel: Webhooks

      # #146, ADR 0073: the speech provider failed every call for 10 minutes while people used
      # voice: no transcript reaches the room and no reply is spoken. `unless` (not `and … == 0`)
      # so it also fires when no call has ever succeeded, after a restart, when no `ok` series
      # exists. Empty transcripts and busy refusals are not provider failures.
      - alert: SpeechProviderFailing
        expr: sum(increase(rubato_voice_speech_total{rubato_outcome!~"ok|empty|busy"}[10m])) > 0 unless sum(increase(rubato_voice_speech_total{rubato_outcome="ok"}[10m])) > 0
        labels:
          severity: ticket
          seam: server-speech
          owner: rubato-server
        annotations:
          summary: "Every speech provider call failed in the last 10 minutes"
          panel: Voice

      # #134, ADR 0072: a person's lead agent asked to act on another person's session, or a
      # request named a lead this companion's pairing does not own. The line between people was
      # tested: page at once. `not_led` (the owner's own session the lead did not start) is
      # counted only, and does not fire this.
      - alert: FleetCrossOwner
        expr: sum(increase(rubato_fleet_requests_total{rubato_reason=~"other_owner|identity"}[10m])) > 0
        labels:
          severity: page
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "A lead agent's fleet request named another person's session or a lead it does not own"
          panel: Fleet requests by action and outcome

      # #345, ADR 0087: inside a tenant, a member named a repository of another tenant, or one
      # no installation covers, and was answered 404. Either the web sent it (a bug: the page
      # only offers its own tenant's repositories) or someone is probing the line between
      # tenants. The count carries the tenant the request was made in.
      - alert: TenantCrossAccess
        expr: sum by (rubato_tenant) (increase(rubato_web_rejected_total{rubato_reason="other_tenant"}[10m])) > 0
        labels:
          severity: ticket
          seam: web-server
          owner: rubato-server
        annotations:
          summary: "In tenant {{ $labels.rubato_tenant }} a request named another tenant's repository in the last 10 minutes"
          panel: Requests and refusals by tenant

      # #345, ADR 0087: a companion keeps sending for launches whose owner is no longer a member
      # of the launch's tenant. One or two after a removal are the outbox draining; more than
      # five in half an hour is a companion that should have been stopped, still running agents
      # in a tenant its owner left.
      - alert: CompanionRefusedNotMember
        expr: sum(increase(rubato_companion_refused_total{rubato_reason="not_member"}[30m])) > 5
        labels:
          severity: ticket
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "A companion still sends for launches of a person who left the launch's tenant"
          panel: Companion refusals

      # #345, ADR 0087: GitHub suspended an attached installation. Nothing of its tenant's
      # repositories is read, and to the tenant that looks like a map that stopped moving.
      # Held for 15 minutes: a suspension that is lifted at once needs nobody.
      - alert: InstallationSuspended
        expr: max(rubato_github_installations_suspended) > 0
        for: 15m
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "An attached GitHub App installation has been suspended for 15 minutes; its tenant's repositories are not read"
          panel: GitHub budget by installation

      # #345, ADR 0090: one route answered more than 50 requests with 429 in ten minutes. On the
      # anonymous paths that is a flood being held off; on a write route it is a page stuck in a
      # loop, or a limit set too low for real use.
      - alert: RateLimited
        expr: sum by (rubato_route) (increase(rubato_web_rejected_total{rubato_reason="rate_limited"}[10m])) > 50
        labels:
          severity: ticket
          seam: web-server
          owner: rubato-server
        annotations:
          summary: "Route {{ $labels.rubato_route }} refused more than 50 requests as rate limited in 10 minutes"
          panel: Requests and refusals by tenant

      # #345, ADR 0087: with the App public, anyone may install it, and each such installation
      # sends deliveries this server drops (answered 200, nothing done). That is a count, not a
      # page per delivery; more than 100 an hour is someone's busy organisation attached to no
      # tenant, worth attaching or asking to uninstall.
      - alert: WebhookUnattachedHigh
        expr: sum(increase(rubato_github_webhook_deliveries_total{rubato_outcome="unattached"}[1h])) > 100
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "More than 100 webhook deliveries in an hour came from installations attached to no tenant"
          panel: Webhooks
