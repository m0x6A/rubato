# Things that must never be silent (AGENTS.md). Metric names are the OTLP names from
# crates/rubato-protocol/src/otel.rs after the Prometheus conversion (dots to underscores,
# _total on counters). Each rule has a unit test in tests/ that makes it fire on purpose.
groups:
  - name: rubato
    rules:
      # N is the server's configured threshold (#105), exported as rubato.companion.silent_secs;
      # without that series the rule falls back to the AGENTS.md default of 600 s, never silent.
      - alert: CompanionSilent
        expr: time() - max by (rubato_companion_id, rubato_user) (rubato_companion_heartbeat) > on() group_left() (max(rubato_companion_silent_secs) or vector(600))
        for: 0m
        labels:
          severity: page
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "Companion {{ $labels.rubato_companion_id }} ({{ $labels.rubato_user }}) has not reported for {{ $value | humanizeDuration }}"
          panel: Companions

      - alert: SessionWorkingNoHooks
        expr: |
          sum by (rubato_companion_id) (rubato_sessions_by_state{rubato_session_state="working"}) > 0
          and
          sum by (rubato_companion_id) (rate(rubato_hook_forwarded_total[2m])) == 0
        for: 2m
        labels:
          severity: page
          seam: companion-claude-code
          owner: rubato-companion
        annotations:
          summary: "A session on companion {{ $labels.rubato_companion_id }} reports working but no hook has arrived"
          panel: Hooks/min vs working sessions

      - alert: PlanUnknownNodes
        expr: rubato_plan_unknown_id_count > 0
        for: 0m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} plan id(s) are not in the map of workspace {{ $labels.rubato_workspace }}"
          panel: Plan checks

      - alert: SeamCollision
        expr: rubato_seam_open_plans > 1
        for: 0m
        labels:
          severity: ticket
          owner: rubato-server
        annotations:
          summary: "{{ $value }} open plans touch seam {{ $labels.rubato_seam }} in workspace {{ $labels.rubato_workspace }}"
          panel: Map

      - alert: GitHubRateLimitLow
        expr: rubato_github_rate_limit_remaining / rubato_github_rate_limit_limit < 0.10
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "GitHub rate limit under 10% ({{ $value | humanizePercentage }})"
          panel: GitHub calls · Rate limit

      # The poll loop ticks at least every 300 s (RUBATO_GITHUB_POLL_SECS is clamped), so ten
      # minutes without a tick means the loop is dead or hung, or the server is gone (#20, O1).
      - alert: ServerPollSilent
        expr: increase(rubato_poll_ticks_total[10m]) == 0 or absent_over_time(rubato_poll_ticks_total[10m])
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "rubato-server has not completed a poll tick for 10 minutes"
          panel: Poll ticks

      # #104, ADR 0039: the traffic report is older than 10 minutes while a source is configured.
      # The server reports stale (and draws unknown) past 3 × the fetch interval; this pages on a
      # dead source. With no source the gauge is not exported, so the rule stays silent.
      - alert: TrafficReportStale
        expr: max(rubato_traffic_report_age) > 600
        for: 0m
        labels:
          severity: ticket
          seam: web-server
          owner: rubato-server
        annotations:
          summary: "The traffic report is {{ $value }}s old: the Traffic lens says unknown"
          panel: Traffic report age

      # #122, ADR 0051: a message has waited more than 10 minutes while its launched session
      # waits for input (last hook Stop or idle_prompt; a fresh launch never counts). The queue
      # does not move: the companion is not live, lacks session_input, or keeps answering not_idle.
      - alert: SessionMessageStuck
        expr: max(rubato_session_messages_oldest_idle_queued_seconds) > 600
        for: 5m
        labels:
          severity: ticket
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "A session message has waited {{ $value | humanizeDuration }} for a session that waits for input"
          panel: Oldest message waiting for an idle session

      # #122, ADR 0055: an approval delivered more than 30 minutes ago, still current, with no
      # matching commit and no committed handoff report. A plan_changed handoff makes the
      # approval no longer current, so it does not count.
      - alert: ApprovalNoHandoff
        expr: max(rubato_plans_handoff_overdue) > 0
        for: 30m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} approval(s) in Rubato have not reached their branch"
          panel: Approvals waiting for handoff

      # #122, ADR 0055: a handoff commit is on the branch, but its link comment is not on the issue.
      - alert: HandoffNoLinkComment
        expr: max(rubato_plans_link_comment_missing) > 0
        for: 30m
        labels:
          severity: ticket
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "{{ $value }} handoff commit(s) have no link comment on their issue"
          panel: Link comments missing

      # #122, ADR 0054: the plan on a branch carries an approval record that differs from
      # Rubato's, or one Rubato did not make. No link comment is posted for it.
      - alert: ApprovalRecordMismatch
        expr: max(rubato_plans_approval_record_mismatch) > 0
        for: 5m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} plan(s) carry an approval record that differs from Rubato's"
          panel: Approval records that differ
