# Things that must never be silent (AGENTS.md). Metric names are the OTLP names from
# crates/rubato-protocol/src/otel.rs after the Prometheus conversion (dots to underscores,
# _total on counters). Each rule has a unit test in tests/ that makes it fire on purpose.
groups:
  - name: rubato
    rules:
      # N is the server's configured threshold (#105), exported as rubato.companion.silent_secs;
      # without that series the rule falls back to the AGENTS.md default of 600 s, never silent.
      - alert: CompanionSilent
        expr: time() - max by (rubato_companion_id, rubato_user) (rubato_companion_heartbeat) > on() group_left() (max(rubato_companion_silent_secs) or vector(600))
        for: 0m
        labels:
          severity: page
          seam: companion-server
          owner: rubato-server
        annotations:
          summary: "Companion {{ $labels.rubato_companion_id }} ({{ $labels.rubato_user }}) has not reported for {{ $value | humanizeDuration }}"
          panel: Companions

      - alert: SessionWorkingNoHooks
        expr: |
          sum by (rubato_companion_id) (rubato_sessions_by_state{rubato_session_state="working"}) > 0
          and
          sum by (rubato_companion_id) (rate(rubato_hook_forwarded_total[2m])) == 0
        for: 2m
        labels:
          severity: page
          seam: companion-claude-code
          owner: rubato-companion
        annotations:
          summary: "A session on companion {{ $labels.rubato_companion_id }} reports working but no hook has arrived"
          panel: Hooks/min vs working sessions

      - alert: PlanUnknownNodes
        expr: rubato_plan_unknown_id_count > 0
        for: 0m
        labels:
          severity: ticket
          seam: server-plan-file
          owner: plan-file
        annotations:
          summary: "{{ $value }} plan id(s) are not in the map"
          panel: Plan checks

      - alert: SeamCollision
        expr: rubato_seam_open_plans > 1
        for: 0m
        labels:
          severity: ticket
          owner: rubato-server
        annotations:
          summary: "{{ $value }} open plans touch seam {{ $labels.rubato_seam }}"
          panel: Map

      - alert: GitHubRateLimitLow
        expr: rubato_github_rate_limit_remaining / rubato_github_rate_limit_limit < 0.10
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "GitHub rate limit under 10% ({{ $value | humanizePercentage }})"
          panel: GitHub calls · Rate limit

      # The poll loop ticks at least every 300 s (RUBATO_GITHUB_POLL_SECS is clamped), so ten
      # minutes without a tick means the loop is dead or hung, or the server is gone (#20, O1).
      - alert: ServerPollSilent
        expr: increase(rubato_poll_ticks_total[10m]) == 0 or absent_over_time(rubato_poll_ticks_total[10m])
        for: 0m
        labels:
          severity: page
          seam: server-github
          owner: rubato-server
        annotations:
          summary: "rubato-server has not completed a poll tick for 10 minutes"
          panel: Poll ticks
