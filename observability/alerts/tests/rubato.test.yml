# promtool test rules tests/rubato.test.yml — every rule fires on purpose once, and stays quiet once.
rule_files:
  - ../rubato.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Heartbeat stamped at unix second 0 and never again: silent.
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0x20"
      # A companion whose heartbeat keeps up with the clock.
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c2", rubato_user="alice"}'
        values: "0+60x20"
      # The server's configured N (#105), at its default.
      - series: "rubato_companion_silent_secs"
        values: "600x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: CompanionSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
              rubato_companion_id: c1
              rubato_user: m0x6A
            exp_annotations:
              summary: "Companion c1 (m0x6A) has not reported for 15m 0s"
              panel: Companions
      - eval_time: 5m
        alertname: CompanionSilent
        exp_alerts: []

  # #105: the server is configured with N = 300 s, and the alert follows it.
  - interval: 1m
    input_series:
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0x20"
      - series: "rubato_companion_silent_secs"
        values: "300x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: CompanionSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
              rubato_companion_id: c1
              rubato_user: m0x6A
            exp_annotations:
              summary: "Companion c1 (m0x6A) has not reported for 6m 0s"
              panel: Companions
      - eval_time: 4m
        alertname: CompanionSilent
        exp_alerts: []

  # #105: no threshold series (an older server, or a dropped export): the alert falls back to
  # 600 s rather than never firing.
  - interval: 1m
    input_series:
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 11m
        alertname: CompanionSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
              rubato_companion_id: c1
              rubato_user: m0x6A
            exp_annotations:
              summary: "Companion c1 (m0x6A) has not reported for 11m 0s"
              panel: Companions
      - eval_time: 9m
        alertname: CompanionSilent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1", rubato_hook_event="PreToolUse"}'
        values: "5x10"
      - series: 'rubato_sessions_by_state{rubato_companion_id="c2", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c2", rubato_hook_event="PreToolUse"}'
        values: "0+3x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions

  # A turn ends and the hooks stop with it: the server records working = 0 (every status is
  # recorded on each snapshot), so the alert clears instead of paging on every finished turn.
  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x5 0x10"
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="idle"}'
        values: "0x5 1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1", rubato_hook_event="PreToolUse"}'
        values: "5x16"
    alert_rule_test:
      - eval_time: 5m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions
      - eval_time: 10m
        alertname: SessionWorkingNoHooks
        exp_alerts: []

  # A restarted companion: the sessions it launched earlier post hooks to the old port, so the
  # only hook series is the one seeded at 0 on startup. Without that series the `and` would
  # have no right-hand side and the alert would stay silent.
  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions

  - interval: 1m
    input_series:
      # Per workspace (ADR 0044): shop has an unknown id, default has none, so one alert fires.
      - series: 'rubato_plan_unknown_id_count{rubato_workspace="shop"}'
        values: "0 0 1 1"
      - series: 'rubato_plan_unknown_id_count{rubato_workspace="default"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: PlanUnknownNodes
        exp_alerts: []
      - eval_time: 3m
        alertname: PlanUnknownNodes
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-plan-file
              owner: plan-file
              rubato_workspace: shop
            exp_annotations:
              summary: "1 plan id(s) are not in the map of workspace shop"
              panel: Plan checks

  - interval: 1m
    input_series:
      - series: 'rubato_seam_open_plans{rubato_seam="companion-server",rubato_workspace="default"}'
        values: "2x5"
      - series: 'rubato_seam_open_plans{rubato_seam="web-server",rubato_workspace="default"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: SeamCollision
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: rubato-server
              rubato_seam: companion-server
              rubato_workspace: default
            exp_annotations:
              summary: "2 open plans touch seam companion-server in workspace default"
              panel: Map

  - interval: 1m
    input_series:
      - series: 'rubato_github_rate_limit_remaining'
        values: "400x5"
      - series: 'rubato_github_rate_limit_limit'
        values: "5000x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: GitHubRateLimitLow
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "GitHub rate limit under 10% (8%)"
              panel: GitHub calls · Rate limit

  # Ticks for ten minutes, then stop: fires once the 10 m window holds no increase.
  - interval: 1m
    input_series:
      - series: 'rubato_poll_ticks_total'
        values: "0+1x10 10x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: ServerPollSilent
        exp_alerts: []
      - eval_time: 22m
        alertname: ServerPollSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "rubato-server has not completed a poll tick for 10 minutes"
              panel: Poll ticks

  # The counter never exported at all (server down, or the loop never spawned).
  - interval: 1m
    input_series:
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ServerPollSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "rubato-server has not completed a poll tick for 10 minutes"
              panel: Poll ticks

  # #104: a configured source's report is 300 s old, then 700 s: fires past 600 s. With no
  # source configured the gauge is absent and the rule stays silent (unknown is not stale).
  - interval: 1m
    input_series:
      - series: 'rubato_traffic_report_age'
        values: "300x5 700x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: TrafficReportStale
        exp_alerts: []
      - eval_time: 8m
        alertname: TrafficReportStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: web-server
              owner: rubato-server
            exp_annotations:
              summary: "The traffic report of workspace default is 700s old: the Traffic lens says unknown"
              panel: Traffic report age
  # #189 (ADR 0075): one workspace's report goes stale while default's stays fresh: the alert
  # fires for that workspace alone, and names it.
  - interval: 1m
    input_series:
      - series: 'rubato_traffic_report_age'
        values: "100x10"
      - series: 'rubato_traffic_report_age{rubato_workspace="shop"}'
        values: "100x5 700x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: TrafficReportStale
        exp_alerts: []
      - eval_time: 8m
        alertname: TrafficReportStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: web-server
              owner: rubato-server
              rubato_workspace: shop
            exp_annotations:
              summary: "The traffic report of workspace shop is 700s old: the Traffic lens says unknown"
              panel: Traffic report age
  - interval: 1m
    input_series:
      - series: 'rubato_poll_ticks_total'
        values: "0+1x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: TrafficReportStale
        exp_alerts: []

  # #322 (ADR 0084): with a 900 s interval a source 1000 s old is late by one tick, not stale;
  # at 3000 s, past three intervals, it fires for that source alone. The other source stays
  # current and silent.
  - interval: 1m
    input_series:
      - series: 'rubato_graph_regen_interval'
        values: "900x10"
      - series: 'rubato_graph_source_age{rubato_graph_source="repo/m0x6A/rubato"}'
        values: "1000x5 3000x5"
      - series: 'rubato_graph_source_age{rubato_graph_source="team"}'
        values: "60x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: ContextGraphStale
        exp_alerts: []
      - eval_time: 8m
        alertname: ContextGraphStale
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-github
              owner: rubato-server
              rubato_graph_source: repo/m0x6A/rubato
            exp_annotations:
              summary: "The context graph source repo/m0x6A/rubato was last current 3000s ago: agents read an old graph"
              panel: Context graph source age
  # A longer interval moves the bar with it: 3000 s is within three intervals of 1800 s.
  - interval: 1m
    input_series:
      - series: 'rubato_graph_regen_interval'
        values: "1800x10"
      - series: 'rubato_graph_source_age{rubato_graph_source="repo/m0x6A/rubato"}'
        values: "3000x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: ContextGraphStale
        exp_alerts: []
  # #322 (ADR 0086): one companion's copy falls behind and stays behind; past three intervals
  # it fires for that companion alone. The other is in step (0) and silent. The server's
  # interval series is absent here, so the bar is three default intervals, 2700 s.
  - interval: 1m
    input_series:
      - series: 'rubato_graph_copy_behind{rubato_companion_id="c-behind"}'
        values: "600x5 3000x5"
      - series: 'rubato_graph_copy_behind{rubato_companion_id="c-in-step"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: ContextGraphCopyBehind
        exp_alerts: []
      - eval_time: 8m
        alertname: ContextGraphCopyBehind
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: companion-server
              owner: rubato-server
              rubato_companion_id: c-behind
            exp_annotations:
              summary: "Companion c-behind's copy of the context graph has been behind for 50m 0s: its agents read an old graph"
              panel: Context graph snapshots served and synced
  # A server with a longer interval moves the bar: 3000 s is within three intervals of 1800 s.
  - interval: 1m
    input_series:
      - series: 'rubato_graph_regen_interval'
        values: "1800x10"
      - series: 'rubato_graph_copy_behind{rubato_companion_id="c-behind"}'
        values: "3000x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: ContextGraphCopyBehind
        exp_alerts: []
  # The flag off: no gauge of the graph at all, and the rule stays silent.
  - interval: 1m
    input_series:
      - series: 'rubato_poll_ticks_total'
        values: "0+1x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: ContextGraphStale
        exp_alerts: []

  # #122: the oldest message waiting for an idle session grows a minute a minute; past 600 s
  # for 5 minutes it fires. A queue that drains stays quiet.
  - interval: 1m
    input_series:
      - series: 'rubato_session_messages_oldest_idle_queued_seconds'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: SessionMessageStuck
        exp_alerts: []
      - eval_time: 20m
        alertname: SessionMessageStuck
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: companion-server
              owner: rubato-server
            exp_annotations:
              summary: "A session message has waited 20m 0s for a session that waits for input"
              panel: Oldest message waiting for an idle session
  - interval: 1m
    input_series:
      - series: 'rubato_session_messages_oldest_idle_queued_seconds'
        values: "0+60x5 0x25"
    alert_rule_test:
      - eval_time: 12m
        alertname: SessionMessageStuck
        exp_alerts: []

  # #122: one approval overdue from minute 5; it pages only after 30 minutes of it.
  - interval: 1m
    input_series:
      - series: 'rubato_plans_handoff_overdue'
        values: "0x5 1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ApprovalNoHandoff
        exp_alerts: []
      - eval_time: 40m
        alertname: ApprovalNoHandoff
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-plan-file
              owner: plan-file
            exp_annotations:
              summary: "1 approval(s) in Rubato have not reached their branch"
              panel: Approvals waiting for handoff

  # #122: one link comment missing from minute 5; it pages only after 30 minutes of it.
  - interval: 1m
    input_series:
      - series: 'rubato_plans_link_comment_missing'
        values: "0x5 1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: HandoffNoLinkComment
        exp_alerts: []
      - eval_time: 40m
        alertname: HandoffNoLinkComment
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "1 handoff commit(s) have no link comment on their issue"
              panel: Link comments missing

  # #122: two mismatched records from minute 3; it fires after 5 minutes of them.
  - interval: 1m
    input_series:
      - series: 'rubato_plans_approval_record_mismatch'
        values: "0x3 2x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: ApprovalRecordMismatch
        exp_alerts: []
      - eval_time: 10m
        alertname: ApprovalRecordMismatch
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-plan-file
              owner: plan-file
            exp_annotations:
              summary: "2 plan(s) carry an approval record that differs from Rubato's"
              panel: Approval records that differ

  # #138: a turn killed by its quiet bound at minute 5 fires; stops and cap kills never do.
  - interval: 1m
    input_series:
      - series: 'rubato_headless_killed_total{rubato_reason="quiet"}'
        values: "0x5 1x20"
      - series: 'rubato_headless_killed_total{rubato_reason="stop"}'
        values: "0+1x25"
      - series: 'rubato_headless_killed_total{rubato_reason="cap"}'
        values: "0+1x25"
    alert_rule_test:
      - eval_time: 4m
        alertname: HeadlessTurnsKilled
        exp_alerts: []
      - eval_time: 10m
        alertname: HeadlessTurnsKilled
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: companion-claude-code
              owner: rubato-companion
            exp_annotations:
              summary: "Headless turns were killed by a time bound or at a companion restart in the last 30 minutes"
              panel: Headless turns

  # #208, ADR 0074: the last accepted delivery at 1000 s; the catch-up finds a change at 2000 s
  # (a delivery missed, not yet 30 minutes), then at 4000 s (the hook has been silent 50 minutes
  # while changes happen): fires. A delivery at 4100 s resolves it.
  - interval: 1m
    input_series:
      - series: "rubato_github_webhook_last_accepted_at"
        values: "1000x10 4100x5"
      - series: "rubato_github_catchup_last_change_at"
        values: "0x2 2000x3 4000x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: GitHubWebhooksSilent
        exp_alerts: []
      - eval_time: 4m
        alertname: GitHubWebhooksSilent
        exp_alerts: []
      - eval_time: 8m
        alertname: GitHubWebhooksSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "The catch-up poll found a change more than 30 minutes after the last GitHub webhook delivery"
              panel: Webhooks
      - eval_time: 13m
        alertname: GitHubWebhooksSilent
        exp_alerts: []

  # Never an accepted delivery (only pings and ignored events arrive, or none at all) while the
  # catch-up, at a 3600 s interval, finds a change: fires.
  - interval: 1m
    input_series:
      - series: "rubato_github_webhook_last_accepted_at"
        values: "0x10"
      - series: "rubato_github_catchup_last_change_at"
        values: "0x3 7200x6"
    alert_rule_test:
      - eval_time: 2m
        alertname: GitHubWebhooksSilent
        exp_alerts: []
      - eval_time: 6m
        alertname: GitHubWebhooksSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "The catch-up poll found a change more than 30 minutes after the last GitHub webhook delivery"
              panel: Webhooks

  # A quiet team: deliveries stopped long ago and the catch-up found nothing since. Webhooks
  # off: no series at all. Both stay silent.
  - interval: 1m
    input_series:
      - series: "rubato_github_webhook_last_accepted_at"
        values: "1000x10"
      - series: "rubato_github_catchup_last_change_at"
        values: "900x10"
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: GitHubWebhooksSilent
        exp_alerts: []
      - eval_time: 9m
        alertname: GitHubWebhooksStuck
        exp_alerts: []

  # #208: an accepted delivery waits 120 s (quiet), then 400 s (fires), then is applied (0).
  - interval: 1m
    input_series:
      - series: "rubato_github_webhook_pending_oldest_seconds"
        values: "0x2 120x2 400x3 0x3"
    alert_rule_test:
      - eval_time: 3m
        alertname: GitHubWebhooksStuck
        exp_alerts: []
      - eval_time: 7m
        alertname: GitHubWebhooksStuck
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "A GitHub webhook delivery has waited over 5 minutes to be applied"
              panel: Webhooks
      - eval_time: 12m
        alertname: GitHubWebhooksStuck
        exp_alerts: []

  # #146, ADR 0073: after a restart no call has succeeded yet and every transcription times out:
  # no `ok` series exists at all, and the rule still fires.
  - interval: 1m
    input_series:
      - series: 'rubato_voice_speech_total{rubato_voice_op="stt",rubato_outcome="timeout",rubato_voice_provider="openai_compatible"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: SpeechProviderFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-speech
              owner: rubato-server
            exp_annotations:
              summary: "Every speech provider call failed in the last 10 minutes"
              panel: Voice

  # Some calls fail but others succeed: the provider works, no alert. Only `ok`, `empty` and
  # `busy`: no alert either.
  - interval: 1m
    input_series:
      - series: 'rubato_voice_speech_total{rubato_voice_op="tts",rubato_outcome="status",rubato_voice_provider="openai_compatible"}'
        values: "0+1x15"
      - series: 'rubato_voice_speech_total{rubato_voice_op="stt",rubato_outcome="ok",rubato_voice_provider="openai_compatible"}'
        values: "0+2x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: SpeechProviderFailing
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'rubato_voice_speech_total{rubato_voice_op="stt",rubato_outcome="ok",rubato_voice_provider="fake"}'
        values: "0+1x15"
      - series: 'rubato_voice_speech_total{rubato_voice_op="stt",rubato_outcome="empty",rubato_voice_provider="fake"}'
        values: "0+1x15"
      - series: 'rubato_voice_speech_total{rubato_voice_op="stt",rubato_outcome="busy",rubato_voice_provider="fake"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: SpeechProviderFailing
        exp_alerts: []

  # #134, ADR 0072: a lead asked to message another person's session: pages at once.
  - interval: 1m
    input_series:
      - series: 'rubato_fleet_requests_total{rubato_fleet_action="message",rubato_outcome="refused",rubato_reason="other_owner"}'
        values: "0 0 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: FleetCrossOwner
        exp_alerts: []
      - eval_time: 3m
        alertname: FleetCrossOwner
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
            exp_annotations:
              summary: "A lead agent's fleet request named another person's session or a lead it does not own"
              panel: Fleet requests by action and outcome

  # A forged lead identity fires too; the owner's own session (not_led) and ok calls do not.
  - interval: 1m
    input_series:
      - series: 'rubato_fleet_requests_total{rubato_fleet_action="list",rubato_outcome="refused",rubato_reason="identity"}'
        values: "0 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: FleetCrossOwner
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
            exp_annotations:
              summary: "A lead agent's fleet request named another person's session or a lead it does not own"
