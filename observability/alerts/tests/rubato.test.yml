# promtool test rules tests/rubato.test.yml — every rule fires on purpose once, and stays quiet once.
rule_files:
  - ../rubato.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Heartbeat stamped at unix second 0 and never again: silent.
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0x20"
      # A companion whose heartbeat keeps up with the clock.
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c2", rubato_user="alice"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: CompanionSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-server
              owner: rubato-server
              rubato_companion_id: c1
              rubato_user: m0x6A
            exp_annotations:
              summary: "Companion c1 (m0x6A) has not reported for over 10 minutes"
              panel: Companions
      - eval_time: 5m
        alertname: CompanionSilent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1", rubato_hook_event="PreToolUse"}'
        values: "5x10"
      - series: 'rubato_sessions_by_state{rubato_companion_id="c2", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c2", rubato_hook_event="PreToolUse"}'
        values: "0+3x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions

  # A turn ends and the hooks stop with it: the server records working = 0 (every status is
  # recorded on each snapshot), so the alert clears instead of paging on every finished turn.
  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x5 0x10"
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="idle"}'
        values: "0x5 1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1", rubato_hook_event="PreToolUse"}'
        values: "5x16"
    alert_rule_test:
      - eval_time: 5m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions
      - eval_time: 10m
        alertname: SessionWorkingNoHooks
        exp_alerts: []

  # A restarted companion: the sessions it launched earlier post hooks to the old port, so the
  # only hook series is the one seeded at 0 on startup. Without that series the `and` would
  # have no right-hand side and the alert would stay silent.
  - interval: 1m
    input_series:
      - series: 'rubato_sessions_by_state{rubato_companion_id="c1", rubato_session_state="working"}'
        values: "1x10"
      - series: 'rubato_hook_forwarded_total{rubato_companion_id="c1"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: SessionWorkingNoHooks
        exp_alerts:
          - exp_labels:
              severity: page
              seam: companion-claude-code
              owner: rubato-companion
              rubato_companion_id: c1
            exp_annotations:
              summary: "A session on companion c1 reports working but no hook has arrived"
              panel: Hooks/min vs working sessions

  - interval: 1m
    input_series:
      - series: 'rubato_plan_unknown_id_count'
        values: "0 0 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: PlanUnknownNodes
        exp_alerts: []
      - eval_time: 3m
        alertname: PlanUnknownNodes
        exp_alerts:
          - exp_labels:
              severity: ticket
              seam: server-plan-file
              owner: plan-file
            exp_annotations:
              summary: "1 plan id(s) are not in the map"
              panel: Plan checks

  - interval: 1m
    input_series:
      - series: 'rubato_seam_open_plans{rubato_seam="companion-server"}'
        values: "2x5"
      - series: 'rubato_seam_open_plans{rubato_seam="web-server"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: SeamCollision
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: rubato-server
              rubato_seam: companion-server
            exp_annotations:
              summary: "2 open plans touch seam companion-server"
              panel: Map

  - interval: 1m
    input_series:
      - series: 'rubato_github_rate_limit_remaining'
        values: "400x5"
      - series: 'rubato_github_rate_limit_limit'
        values: "5000x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: GitHubRateLimitLow
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "GitHub rate limit under 10% (8%)"
              panel: GitHub calls · Rate limit

  # Ticks for ten minutes, then stop: fires once the 10 m window holds no increase.
  - interval: 1m
    input_series:
      - series: 'rubato_poll_ticks_total'
        values: "0+1x10 10x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: ServerPollSilent
        exp_alerts: []
      - eval_time: 22m
        alertname: ServerPollSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "rubato-server has not completed a poll tick for 10 minutes"
              panel: Poll ticks

  # The counter never exported at all (server down, or the loop never spawned).
  - interval: 1m
    input_series:
      - series: 'rubato_companion_heartbeat{rubato_companion_id="c1", rubato_user="m0x6A"}'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ServerPollSilent
        exp_alerts:
          - exp_labels:
              severity: page
              seam: server-github
              owner: rubato-server
            exp_annotations:
              summary: "rubato-server has not completed a poll tick for 10 minutes"
              panel: Poll ticks
