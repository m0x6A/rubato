name: rubato plan check
description: Fail a PR whose plan names an unknown map id or lacks an O-row per seam it touches.
inputs:
  map:
    description: Path to system-map.yml
    required: true
  maps:
    description: More maps, one per line, for a repo several workspaces name (ADR 0045). A plan passes when it fits any of them.
    required: false
    default: ""
  plans:
    description: Glob of plan files to check
    required: false
    default: docs/plans/*.md
  node-version:
    description: Node version (needs --experimental-strip-types, 22.6 or newer)
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    # The versions in package-lock.json, as tested here; no install scripts run in the consumer's job.
    - name: Install plan-check dependencies
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --ignore-scripts --omit=dev --no-audit --no-fund
    # Inputs reach the shell through env only, quoted, so a value is a path or a glob, never code (#195).
    - name: Check plans
      shell: bash
      env:
        MAP: ${{ inputs.map }}
        MAPS: ${{ inputs.maps }}
        PLANS: ${{ inputs.plans }}
      run: |
        extra=()
        while IFS= read -r m; do [ -n "$m" ] && extra+=(--map "$m"); done <<< "$MAPS"
        node --experimental-strip-types "$GITHUB_ACTION_PATH/src/cli.ts" --map "$MAP" "${extra[@]}" --schema-dir "$GITHUB_ACTION_PATH/../../schema" --plans "$PLANS"
