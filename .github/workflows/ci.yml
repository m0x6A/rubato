name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Downloads are pinned and checked (#195). Actions are pinned to a commit, the tag in a comment.
env:
  # sha256 GitHub records for the tmux 3.8 release asset; tmux publishes no checksum file.
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
  # npm checks the registry's integrity hash; the GitHub release ships no npm tarball to pin.
  TMUX_IDE_VERSION: 2.9.24
  PROMETHEUS_VERSION: 3.16.0
  # The prometheus-3.16.0.linux-amd64.tar.gz line of that release's sha256sums.txt.
  PROMETHEUS_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The commit of the action's `stable` branch defaults to stable; named here so the pin reads plainly.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install tmux 3.8 and tmux-ide for the companion's Gherkin suite
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libevent-dev libncurses-dev bison
          wget -q https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          echo "$TMUX_SHA256  tmux-3.8.tar.gz" | sha256sum -c -
          tar xzf tmux-3.8.tar.gz && cd tmux-3.8 && ./configure --prefix="$HOME/.local" -q && make -s -j && make -s install
          npm install -g "tmux-ide@$TMUX_IDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tmux -V && tmux-ide --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: Node (typecheck, test, plan check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Plan check on this repo's own plans
        run: pnpm plan-check --map docs/design/rubato-map.yml --plans "docs/plans/*.md"

  web:
    name: Web (types in step, build, e2e against the server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated protocol types are in step with the schemas
        run: cd web && pnpm gen:types && git diff --exit-code -- src/protocol.ts
      - run: cd web && pnpm build
      - run: cargo build -p rubato-server
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - name: End to end against the real server
        run: cd web && ./e2e/run.sh
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-traces
          path: web/test-results
          retention-days: 7

  e2e:
    name: End to end (two repos, three issues) and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install tmux 3.8 and tmux-ide
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libevent-dev libncurses-dev bison
          wget -q https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          echo "$TMUX_SHA256  tmux-3.8.tar.gz" | sha256sum -c -
          tar xzf tmux-3.8.tar.gz && cd tmux-3.8 && ./configure --prefix="$HOME/.local" -q && make -s -j && make -s install
          npm install -g "tmux-ide@$TMUX_IDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: cargo build --workspace
      - run: pnpm observability:check
      - run: pnpm observability:test
      - name: Alert rules fire on purpose (promtool)
        run: |
          VERSION="$PROMETHEUS_VERSION"
          wget -q "https://github.com/prometheus/prometheus/releases/download/v$VERSION/prometheus-$VERSION.linux-amd64.tar.gz"
          echo "$PROMETHEUS_SHA256  prometheus-$VERSION.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "prometheus-$VERSION.linux-amd64.tar.gz"
          PROMTOOL="$PWD/prometheus-$VERSION.linux-amd64/promtool"
          "$PROMTOOL" check rules observability/alerts/rubato.rules.yml
          "$PROMTOOL" test rules observability/alerts/tests/rubato.test.yml
          # Each rule mutant must fail the rule test case written for it (#41).
          PROMTOOL="$PROMTOOL" pnpm observability:rules
      - run: pnpm e2e
