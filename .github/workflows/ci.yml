name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tmux 3.8 and tmux-ide for the companion's Gherkin suite
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libevent-dev libncurses-dev bison
          wget -q https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          tar xzf tmux-3.8.tar.gz && cd tmux-3.8 && ./configure --prefix="$HOME/.local" -q && make -s -j && make -s install
          npm install -g tmux-ide
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tmux -V && tmux-ide --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: Node (typecheck, test, plan check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Plan check on this repo's own plans
        run: pnpm plan-check --map docs/design/rubato-map.yml --plans "docs/plans/*.md"

  web:
    name: Web (types in step, build, e2e against the server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated protocol types are in step with the schemas
        run: cd web && pnpm gen:types && git diff --exit-code -- src/protocol.ts
      - run: cd web && pnpm build
      - run: cargo build -p rubato-server
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - name: End to end against the real server
        run: cd web && ./e2e/run.sh
